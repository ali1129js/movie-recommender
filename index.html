<!doctype html>
<html lang="en" data-theme="khaki" data-motion="static">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Pick films you like and get recommendations from MovieLens viewer ratings plus a wider all-eras catalogue. Runs entirely in your browser." />
    <meta name="color-scheme" content="light dark" />
    <title>Film Finder – movie recommender</title>
    <script>
      // Apply the saved or system theme and motion before first paint to avoid a flash.
      // Keep in sync with src/lib/theme.ts (light/dark/contrast migrate; contrast -> graphite).
      (function () {
        try {
          var t = localStorage.getItem('movie-recommender-theme');
          if (t === 'light') t = 'khaki';
          else if (t === 'dark' || t === 'contrast') t = 'graphite';
          else if (t !== 'khaki' && t !== 'graphite' && t !== 'midnight') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'graphite' : 'khaki';
          }
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t === 'khaki' ? 'light' : 'dark';
          var m = localStorage.getItem('movie-recommender-motion') === 'animated' ? 'animated' : 'static';
          if (matchMedia('(prefers-reduced-motion: reduce)').matches) m = 'static';
          document.documentElement.dataset.motion = m;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
